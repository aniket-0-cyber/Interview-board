<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board</title>
<style>
  :root {
    --paper:#F7F5F0; --rule:#DFD9CC; --ink:#1C1F26; --ink-soft:#6B6E78;
    --claude:#3A6EA5; --you:#A65D3A; --panel:#FFFFFF; --grid:#E7E2D6;
    --shadow:0 1px 2px rgba(28,31,38,.06), 0 6px 18px rgba(28,31,38,.07);
    --sel:#3A6EA5;
    /* stroke tones */
    --s-none:#DFD9CC; --s-grey:#8A8F9A; --s-red:#C0563D; --s-orange:#C07A2B;
    --s-yellow:#B08300; --s-green:#4C9A63; --s-blue:#3A6EA5; --s-purple:#7A5AA8; --s-pink:#B85C86;
    /* fill tints */
    --f-none:transparent; --f-grey:#ECEAE4; --f-red:#F7E0DA; --f-orange:#FAE8D2;
    --f-yellow:#FBF0C4; --f-green:#DDEEE1; --f-blue:#DCE8F5; --f-purple:#E7DFF4; --f-pink:#F8E0EA;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper:#16181D; --rule:#2C3038; --ink:#E8E6E1; --ink-soft:#8A8F9A;
      --panel:#1D2027; --claude:#6FA3DB; --you:#D08A62; --grid:#1F232A;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35); --sel:#6FA3DB;
      --s-none:#2C3038; --s-grey:#8A8F9A; --s-red:#D9765C; --s-orange:#D9974A;
      --s-yellow:#D6B24A; --s-green:#6FB585; --s-blue:#6FA3DB; --s-purple:#9E82CC; --s-pink:#D77FA5;
      --f-none:transparent; --f-grey:#252932; --f-red:#3A2622; --f-orange:#3A2E1E;
      --f-yellow:#37321D; --f-green:#1F2F26; --f-blue:#1E2A38; --f-purple:#2A2338; --f-pink:#38242E;
    }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; overflow:hidden; }
  body {
    background:var(--paper); color:var(--ink);
    font:14px/1.5 ui-sans-serif,"Inter",system-ui,sans-serif;
    display:flex; flex-direction:column; -webkit-font-smoothing:antialiased;
  }
  button, select, input, textarea { font:inherit; color:inherit; }

  header {
    display:flex; align-items:center; gap:8px; padding:8px 12px;
    border-bottom:1px solid var(--rule); background:var(--panel);
    flex:none; position:relative; z-index:30;
  }
  #board-name { font-weight:600; font-size:15px; border:1px solid transparent; background:none;
    padding:3px 7px; border-radius:6px; flex:0 1 auto; min-width:5ch; max-width:26ch; }
  #board-name:hover { border-color:var(--rule); }
  #board-name:focus { outline:none; border-color:var(--sel); background:var(--paper); }
  select.picker { background:var(--paper); border:1px solid var(--rule); border-radius:7px;
    padding:5px 8px; flex:0 1 auto; min-width:6ch; max-width:20ch; }
  .bar-sep { width:1px; height:22px; background:var(--rule); flex:none; }
  .tools { display:flex; gap:2px; flex:none; }
  .tool, .ghost { border:1px solid transparent; background:none; border-radius:7px;
    padding:5px 9px; cursor:pointer; color:var(--ink-soft); white-space:nowrap; }
  .tool:hover, .ghost:hover:not(:disabled) { background:var(--paper); color:var(--ink); }
  .ghost:disabled { opacity:.35; cursor:default; }
  .tool[aria-pressed="true"] { background:var(--sel); border-color:var(--sel); color:#fff; }
  .spacer { flex:1; }
  .status { display:flex; align-items:center; gap:6px; color:var(--ink-soft); font-size:12.5px; }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--ink-soft); opacity:.5; }
  .dot.live { background:#4C9A63; opacity:1; }
  @media (max-width:860px) { header { flex-wrap:wrap; row-gap:6px; } .spacer { flex-basis:100%; height:0; } }

  main { flex:1; display:flex; min-height:0; }
  #stage { flex:1; position:relative; overflow:hidden; min-width:0;
    background-color:var(--paper);
    background-image:radial-gradient(var(--grid) 1px, transparent 1px);
    background-size:22px 22px; }
  #stage.panning { cursor:grabbing; }
  #stage.adding { cursor:crosshair; }
  #stage.linking { cursor:crosshair; }
  #world { position:absolute; left:0; top:0; transform-origin:0 0; }
  #wires { position:absolute; left:-4000px; top:-3000px; width:12000px; height:9000px;
    pointer-events:none; overflow:visible; }
  #wires path.line { fill:none; }
  #wires text { fill:var(--ink-soft); font-size:11.5px; paint-order:stroke;
    stroke:var(--paper); stroke-width:4px; }
  #wires .hit { stroke:transparent; stroke-width:14; fill:none; pointer-events:stroke; cursor:pointer; }
  #marquee { position:absolute; border:1px solid var(--sel); background:color-mix(in srgb,var(--sel) 12%,transparent);
    pointer-events:none; display:none; }

  .node { position:absolute; display:flex; flex-direction:column; }
  .node .frame { flex:1; min-height:0; display:flex; flex-direction:column;
    border:1.5px solid var(--s-grey); border-radius:10px; background:var(--panel);
    box-shadow:var(--shadow); overflow:hidden; }
  .node.selected .frame { outline:2px solid var(--sel); outline-offset:1px; }
  .node.pulse .frame { animation:pulse .7s ease-out; }
  @keyframes pulse {
    from { box-shadow:0 0 0 0 color-mix(in srgb,var(--sel) 55%,transparent), var(--shadow); }
    to { box-shadow:0 0 0 14px transparent, var(--shadow); }
  }

  .head { display:flex; align-items:center; gap:6px; flex:none; padding:5px 6px 5px 9px;
    border-bottom:1px solid var(--rule); background:color-mix(in srgb,var(--paper) 55%,var(--panel));
    cursor:grab; user-select:none; }
  .head:active { cursor:grabbing; }
  .head .title { flex:1; min-width:0; font-size:12.5px; font-weight:600; border:1px solid transparent;
    border-radius:5px; padding:1px 4px; background:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .head .title:focus { outline:none; border-color:var(--sel); background:var(--panel); }
  .head .title:empty::before { content:attr(data-placeholder); color:var(--ink-soft); font-weight:500; }
  .head select { border:1px solid transparent; background:none; border-radius:5px;
    font-size:11.5px; color:var(--ink-soft); padding:1px 2px; max-width:11ch; }
  .head select:hover { border-color:var(--rule); }
  .icon { border:none; background:none; cursor:pointer; color:var(--ink-soft);
    padding:2px 5px; border-radius:5px; line-height:1; font-size:13px; opacity:0; }
  .node:hover .icon, .node.selected .icon { opacity:1; }
  .icon:hover { background:var(--paper); color:var(--ink); }

  .doc-body { position:relative; flex:1; min-height:0; }
  .doc-body pre, .doc-body textarea { position:absolute; inset:0; margin:0; padding:9px 11px;
    font:12.5px/1.55 ui-monospace,"SF Mono",Menlo,monospace; white-space:pre; overflow:auto;
    border:0; tab-size:2; }
  .doc-body pre { pointer-events:none; color:var(--ink); }
  .doc-body textarea { background:transparent; color:transparent; caret-color:var(--ink);
    resize:none; outline:none; width:100%; height:100%; }
  .tok-str{color:#9A6A2F} .tok-num{color:#7A4FA3} .tok-kw{color:var(--claude);font-weight:600}
  .tok-com{color:var(--ink-soft);font-style:italic}
  @media (prefers-color-scheme:dark){ .tok-str{color:#D5A45E} .tok-num{color:#B693DD} }
  .node[data-lang="markdown"] .doc-body pre, .node[data-lang="markdown"] .doc-body textarea,
  .node[data-lang="text"] .doc-body pre, .node[data-lang="text"] .doc-body textarea {
    font:13.5px/1.6 ui-sans-serif,system-ui,sans-serif; white-space:pre-wrap; }

  .node.box.ellipse .frame { border-radius:50%; }
  .node.box.diamond .frame { border-radius:4px; transform:rotate(45deg); }
  .node.box.diamond .label { transform:rotate(-45deg); }
  .node .label { flex:1; display:flex; align-items:center; justify-content:center;
    text-align:center; padding:8px 10px; outline:none; overflow:hidden; word-break:break-word; }
  .node.sticky .frame { border-radius:3px; border-width:1px;
    box-shadow:0 1px 1px rgba(0,0,0,.08), 0 8px 16px rgba(0,0,0,.10); }
  .node.sticky .label { align-items:flex-start; text-align:left; font-size:13.5px; }
  .node.text .frame { background:none !important; border-color:transparent; box-shadow:none; }
  .node.text .label { justify-content:flex-start; }
  .node.text.selected .frame { border-color:var(--rule); }
  .size-s .label { font-size:12px; } .size-m .label { font-size:14.5px; } .size-l .label { font-size:20px; }
  .bold .label { font-weight:700; }

  .diagram-body { flex:1; min-height:0; display:grid; place-items:center; padding:8px; overflow:auto; }
  .diagram-body svg { max-width:100%; height:auto; }
  .empty { color:var(--ink-soft); font-size:12.5px; }

  .grip { position:absolute; right:-3px; bottom:-3px; width:15px; height:15px;
    cursor:nwse-resize; opacity:0; z-index:2; }
  .grip::after { content:""; position:absolute; right:4px; bottom:4px; width:7px; height:7px;
    border-right:2px solid var(--ink-soft); border-bottom:2px solid var(--ink-soft); border-radius:0 0 3px 0; }
  .node:hover .grip, .node.selected .grip { opacity:.8; }
  .port { position:absolute; inset:-7px; border:2px dashed var(--sel); border-radius:13px;
    opacity:0; pointer-events:none; }
  #stage.linking .node .port { opacity:.45; }
  #stage.linking .node:hover .port, .node.link-source .port { opacity:1; }

  /* selection style bar */
  #styler { position:absolute; left:50%; bottom:18px; transform:translateX(-50%);
    display:none; gap:10px; align-items:center; background:var(--panel);
    border:1px solid var(--rule); border-radius:12px; padding:8px 12px;
    box-shadow:var(--shadow); z-index:20; flex-wrap:wrap; max-width:calc(100% - 24px); }
  #styler.on { display:flex; }
  #styler .group { display:flex; align-items:center; gap:4px; }
  #styler .cap { font-size:11px; color:var(--ink-soft); margin-right:2px; }
  .swatch { width:19px; height:19px; border-radius:50%; cursor:pointer;
    border:1.5px solid var(--rule); padding:0; }
  .swatch.pick { outline:2px solid var(--sel); outline-offset:1px; }
  .swatch.x { position:relative; background:transparent; }
  .swatch.x::after { content:""; position:absolute; inset:3px; border-top:1.5px solid var(--ink-soft);
    transform:rotate(45deg); transform-origin:center; }
  #styler .chip { border:1px solid var(--rule); background:none; border-radius:6px;
    font-size:11.5px; padding:3px 8px; cursor:pointer; color:var(--ink-soft); }
  #styler .chip[aria-pressed="true"] { background:var(--sel); border-color:var(--sel); color:#fff; }
  #hint { position:absolute; left:50%; top:14px; transform:translateX(-50%);
    background:var(--panel); border:1px solid var(--rule); border-radius:999px;
    padding:6px 14px; font-size:12.5px; color:var(--ink-soft); box-shadow:var(--shadow);
    pointer-events:none; opacity:0; transition:opacity .18s; z-index:25; }
  #hint.show { opacity:1; }
  #empty-hint { position:absolute; inset:0; display:grid; place-items:center;
    color:var(--ink-soft); font-size:14px; text-align:center; pointer-events:none; }
  #empty-hint[hidden] { display:none; }
</style>
</head>
<body>

<header>
  <input id="board-name" value="Untitled board" spellcheck="false" aria-label="Board name">
  <select class="picker" id="board-picker" aria-label="Open a saved board"><option value="">Saved…</option></select>
  <button class="ghost" id="new-board">New</button>
  <div class="bar-sep"></div>
  <div class="tools" role="toolbar" aria-label="Tools">
    <button class="tool" data-tool="select" aria-pressed="true" title="Select — V">Select</button>
    <button class="tool" data-tool="box" aria-pressed="false" title="Box — B">Box</button>
    <button class="tool" data-tool="sticky" aria-pressed="false" title="Sticky note — S">Sticky</button>
    <button class="tool" data-tool="text" aria-pressed="false" title="Label — T">Text</button>
    <button class="tool" data-tool="doc" aria-pressed="false" title="Document — D">Doc</button>
    <button class="tool" data-tool="line" aria-pressed="false" title="Connect — L">Line</button>
  </div>
  <div class="bar-sep"></div>
  <button class="ghost" id="undo" title="Undo — Cmd+Z" disabled>Undo</button>
  <button class="ghost" id="redo" title="Redo — Cmd+Shift+Z" disabled>Redo</button>
  <button class="ghost" id="tidy" title="Lay out along the arrows">Tidy</button>
  <button class="ghost" id="export" title="Download the board">Export</button>
  <div class="spacer"></div>
  <div class="status"><span class="dot" id="dot"></span><span id="conn">connecting</span></div>
</header>

<main>
  <div id="stage">
    <div id="world"><svg id="wires"><g id="wire-layer" transform="translate(4000,3000)"></g></svg></div>
    <div id="marquee"></div>
    <div id="empty-hint">Nothing here yet.<br>Ask Claude out loud, or pick a tool above.</div>
    <div id="hint"></div>
    <div id="styler">
      <div class="group"><span class="cap">Fill</span><span id="fills"></span></div>
      <div class="group"><span class="cap">Line</span><span id="strokes"></span></div>
      <div class="group" id="size-group">
        <button class="chip" data-size="s">S</button>
        <button class="chip" data-size="m">M</button>
        <button class="chip" data-size="l">L</button>
        <button class="chip" id="bold">Bold</button>
      </div>
      <div class="group" id="shape-group">
        <button class="chip" data-shape="rect">Rect</button>
        <button class="chip" data-shape="ellipse">Oval</button>
        <button class="chip" data-shape="diamond">Diamond</button>
      </div>
      <div class="group"><button class="chip" id="del-sel">Delete</button></div>
    </div>
  </div>
</main>

<script type="module">
const $ = id => document.getElementById(id);
const token = new URLSearchParams(location.search).get("t") || "";
const COLORS = ["none","grey","red","orange","yellow","green","blue","purple","pink"];

let mermaid = null;
try {
  ({ default: mermaid } = await import("https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs"));
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  mermaid.initialize({ startOnLoad:false, theme: dark ? "dark" : "neutral", securityLevel:"strict" });
} catch { /* offline: diagrams fall back to their source */ }

let ws = null;
let state = { nodes:{}, edges:{}, saved:[] };
let tool = "select";
let selection = new Set();
let linkFrom = null;
let dragging = false;
const els = new Map();
const stamps = new Map();

function send(m) { if (ws?.readyState === 1) ws.send(JSON.stringify(m)); }

function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws?t=${encodeURIComponent(token)}`);
  ws.onopen = () => { $("conn").textContent = "live"; $("dot").classList.add("live"); };
  ws.onclose = () => { $("conn").textContent = "reconnecting"; $("dot").classList.remove("live");
                       setTimeout(connect, 1200); };
  ws.onmessage = e => { const { board, origin } = JSON.parse(e.data); state = board; render(origin); };
}

/* ---- view ---- */
const view = { x:0, y:0, z:1 };
const applyView = () => { $("world").style.transform =
  `translate(${view.x}px, ${view.y}px) scale(${view.z})`; };
function toWorld(cx, cy) {
  const r = $("stage").getBoundingClientRect();
  return { x:(cx - r.left - view.x) / view.z, y:(cy - r.top - view.y) / view.z };
}
$("stage").addEventListener("wheel", e => {
  e.preventDefault();
  if (e.ctrlKey || e.metaKey) {
    const before = toWorld(e.clientX, e.clientY);
    view.z = Math.min(2.5, Math.max(0.2, view.z * (1 - e.deltaY / 400)));
    const after = toWorld(e.clientX, e.clientY);
    view.x += (after.x - before.x) * view.z; view.y += (after.y - before.y) * view.z;
  } else { view.x -= e.deltaX; view.y -= e.deltaY; }
  applyView();
}, { passive:false });

/* ---- tools ---- */
function setTool(next) {
  tool = next;
  for (const b of document.querySelectorAll(".tool"))
    b.setAttribute("aria-pressed", String(b.dataset.tool === next));
  $("stage").classList.toggle("adding", ["box","sticky","text","doc"].includes(next));
  $("stage").classList.toggle("linking", next === "line");
  linkFrom = null;
  document.querySelector(".link-source")?.classList.remove("link-source");
  hint(next === "line" ? "Click one node, then another"
     : ["box","sticky","text","doc"].includes(next) ? "Click the canvas to place it" : "");
}
for (const b of document.querySelectorAll(".tool"))
  b.addEventListener("click", () => setTool(b.dataset.tool));
$("tidy").addEventListener("click", () => send({ type:"user_arrange", layout:"layered" }));
$("undo").addEventListener("click", () => send({ type:"user_undo" }));
$("redo").addEventListener("click", () => send({ type:"user_redo" }));

let hintTimer = null;
function hint(text) {
  clearTimeout(hintTimer);
  $("hint").textContent = text;
  $("hint").classList.toggle("show", Boolean(text));
  if (text) hintTimer = setTimeout(() => $("hint").classList.remove("show"), 2400);
}

addEventListener("keydown", e => {
  const typing = /^(INPUT|TEXTAREA)$/.test(e.target.tagName) || e.target.isContentEditable;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "z") {
    e.preventDefault(); send({ type: e.shiftKey ? "user_redo" : "user_undo" }); return;
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "a" && !typing) {
    e.preventDefault(); select(Object.keys(state.nodes)); return;
  }
  if (typing) { if (e.key === "Escape") e.target.blur(); return; }
  const keys = { v:"select", b:"box", s:"sticky", t:"text", d:"doc", l:"line" };
  if (keys[e.key.toLowerCase()]) { setTool(keys[e.key.toLowerCase()]); return; }
  if (e.key === "Escape") { setTool("select"); select([]); }
  if ((e.key === "Backspace" || e.key === "Delete") && selection.size) {
    send({ type:"user_delete", ids:[...selection] }); select([]);
  }
});

/* ---- selection, marquee, panning ---- */
function select(ids) {
  selection = new Set(ids);
  for (const [id, rec] of els) rec.root.classList.toggle("selected", selection.has(id));
  paintStyler();
}

let pan = null, marquee = null;
$("stage").addEventListener("pointerdown", e => {
  if (e.target.closest(".node") || e.target.closest("#styler")) return;
  if (["box","sticky","text","doc"].includes(tool)) {
    const at = toWorld(e.clientX, e.clientY);
    send({ type:"user_add", kind:tool, x:Math.round(at.x), y:Math.round(at.y),
           text: tool === "doc" ? "" : tool === "sticky" ? "Note" : tool === "box" ? "Box" : "Text" });
    setTool("select");
    return;
  }
  $("stage").setPointerCapture(e.pointerId);
  if (e.button === 1 || e.shiftKey === false && e.altKey) {
    pan = { x:e.clientX, y:e.clientY, vx:view.x, vy:view.y };
    $("stage").classList.add("panning");
    return;
  }
  if (!e.shiftKey) select([]);
  const start = toWorld(e.clientX, e.clientY);
  marquee = { start, sx:e.clientX, sy:e.clientY, base:new Set(selection) };
});
$("stage").addEventListener("pointermove", e => {
  if (pan) {
    view.x = pan.vx + (e.clientX - pan.x); view.y = pan.vy + (e.clientY - pan.y);
    applyView(); return;
  }
  if (!marquee) return;
  const r = $("stage").getBoundingClientRect();
  const box = $("marquee");
  const x1 = Math.min(marquee.sx, e.clientX) - r.left, y1 = Math.min(marquee.sy, e.clientY) - r.top;
  Object.assign(box.style, { display:"block", left:`${x1}px`, top:`${y1}px`,
    width:`${Math.abs(e.clientX - marquee.sx)}px`, height:`${Math.abs(e.clientY - marquee.sy)}px` });
  const now = toWorld(e.clientX, e.clientY);
  const lo = { x:Math.min(marquee.start.x, now.x), y:Math.min(marquee.start.y, now.y) };
  const hi = { x:Math.max(marquee.start.x, now.x), y:Math.max(marquee.start.y, now.y) };
  const inside = Object.values(state.nodes)
    .filter(n => n.x < hi.x && n.x + n.w > lo.x && n.y < hi.y && n.y + n.h > lo.y)
    .map(n => n.id);
  select([...marquee.base, ...inside]);
});
addEventListener("pointerup", () => {
  pan = null; marquee = null;
  $("stage").classList.remove("panning");
  $("marquee").style.display = "none";
});

/* ---- style bar ---- */
function swatches(host, key) {
  host.replaceChildren(...COLORS.map(c => {
    const b = document.createElement("button");
    b.className = "swatch" + (c === "none" ? " x" : "");
    b.dataset.color = c;
    b.title = c;
    if (c !== "none") b.style.background = key === "fill" ? `var(--f-${c})` : `var(--s-${c})`;
    if (key === "fill" && c !== "none") b.style.borderColor = `var(--s-${c})`;
    b.addEventListener("click", () => send({ type:"user_style", ids:[...selection],
                                             edge_ids:[...selection], [key]:c }));
    return b;
  }));
}
swatches($("fills"), "fill");
swatches($("strokes"), "stroke");
for (const b of document.querySelectorAll("#size-group .chip[data-size]"))
  b.addEventListener("click", () => send({ type:"user_style", ids:[...selection], size:b.dataset.size }));
for (const b of document.querySelectorAll("#shape-group .chip[data-shape]"))
  b.addEventListener("click", () => send({ type:"user_style", ids:[...selection], shape:b.dataset.shape }));
$("bold").addEventListener("click", () => {
  const first = state.nodes[[...selection][0]];
  send({ type:"user_style", ids:[...selection], bold:!(first && first.bold) });
});
$("del-sel").addEventListener("click", () => { send({ type:"user_delete", ids:[...selection] }); select([]); });

function paintStyler() {
  const bar = $("styler");
  bar.classList.toggle("on", selection.size > 0);
  if (!selection.size) return;
  const picked = [...selection].map(i => state.nodes[i]).filter(Boolean);
  const first = picked[0];
  if (!first) return;
  for (const b of $("fills").children) b.classList.toggle("pick", b.dataset.color === first.fill);
  for (const b of $("strokes").children) b.classList.toggle("pick", b.dataset.color === first.stroke);
  for (const b of document.querySelectorAll("#size-group .chip[data-size]"))
    b.setAttribute("aria-pressed", String(b.dataset.size === first.size));
  $("bold").setAttribute("aria-pressed", String(Boolean(first.bold)));
  $("shape-group").style.display = picked.some(n => n.type === "box") ? "flex" : "none";
  for (const b of document.querySelectorAll("#shape-group .chip[data-shape]"))
    b.setAttribute("aria-pressed", String(b.dataset.shape === first.shape));
}

/* ---- highlighting ---- */
const KEYWORDS = "\\b(?:def|class|return|yield|lambda|pass|raise|assert|del|global|"
  + "if|elif|else|for|while|break|continue|try|except|finally|with|as|in|is|not|and|or|"
  + "import|from|async|await|None|True|False|self|"
  + "const|let|var|function|new|this|typeof|instanceof|export|default|extends|super|"
  + "interface|type|enum|implements|public|private|protected|static|readonly|"
  + "int|float|double|bool|char|void|struct|impl|fn|mut|pub|match|trait|package|func|defer|go|"
  + "select|where|group|order|by|join|having|insert|update|delete|values)\\b";
const TOKENS = new RegExp(
  '(#[^\\n]*|//[^\\n]*|/\\*[\\s\\S]*?\\*/'
  + '|"""[\\s\\S]*?"""' + "|'''[\\s\\S]*?'''"
  + '|"(?:\\\\.|[^"\\\\])*"' + "|'(?:\\\\.|[^'\\\\])*'" + '|`(?:\\\\.|[^`\\\\])*`)'
  + '|(\\b\\d[\\d_.]*(?:e[+-]?\\d+)?\\b)' + '|(' + KEYWORDS + ')', "g");
const esc = s => s.replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c]));
function highlight(src, lang) {
  const safe = esc(src);
  if (lang === "markdown" || lang === "text") return safe;
  return safe.replace(TOKENS, (m, lit, num, kw) => {
    if (lit) return `<span class="${/^(#|\/\/|\/\*)/.test(lit) ? "tok-com" : "tok-str"}">${lit}</span>`;
    if (num) return `<span class="tok-num">${num}</span>`;
    return `<span class="tok-kw">${kw}</span>`;
  });
}

/* ---- nodes ---- */
const LANGS = ["python","javascript","typescript","java","cpp","go","rust","sql","markdown","text"];
const timers = new Map();
function debounce(key, fn, ms = 240) { clearTimeout(timers.get(key)); timers.set(key, setTimeout(fn, ms)); }

function makeNode(node) {
  const root = document.createElement("div");
  root.className = `node ${node.type}`;
  root.dataset.id = node.id;
  const frame = document.createElement("div"); frame.className = "frame"; root.append(frame);
  const port = document.createElement("div"); port.className = "port"; root.append(port);
  const rec = { root, frame, type:node.type };

  if (node.type === "doc" || node.type === "diagram") {
    const head = document.createElement("div"); head.className = "head";
    const title = document.createElement("div");
    title.className = "title"; title.contentEditable = "plaintext-only"; title.spellcheck = false;
    title.dataset.placeholder = node.type === "doc" ? "Untitled" : "Diagram";
    title.addEventListener("input", () => debounce(node.id + ":t",
      () => send({ type:"user_title", id:node.id, title:title.textContent })));
    head.append(title); rec.title = title;

    if (node.type === "doc") {
      const lang = document.createElement("select");
      lang.append(...LANGS.map(l => new Option(l, l)));
      lang.addEventListener("change", () => send({ type:"user_language", id:node.id, language:lang.value }));
      head.append(lang); rec.lang = lang;
    }
    const close = document.createElement("button");
    close.className = "icon"; close.textContent = "×"; close.title = "Remove";
    close.addEventListener("click", () => send({ type:"user_delete", ids:[node.id] }));
    head.append(close);
    frame.append(head); rec.head = head;

    if (node.type === "doc") {
      const body = document.createElement("div"); body.className = "doc-body";
      const pre = document.createElement("pre"); const code = document.createElement("code");
      pre.append(code);
      const ta = document.createElement("textarea"); ta.spellcheck = false;
      ta.addEventListener("input", () => {
        code.innerHTML = highlight(ta.value, rec.node.language);
        debounce(node.id + ":x", () => send({ type:"user_text", id:node.id, text:ta.value }), 200);
      });
      ta.addEventListener("scroll", () => { pre.scrollTop = ta.scrollTop; pre.scrollLeft = ta.scrollLeft; });
      ta.addEventListener("keydown", ev => {
        if (ev.key === "Tab") {
          ev.preventDefault();
          const { selectionStart:s, selectionEnd:t } = ta;
          ta.value = ta.value.slice(0, s) + "  " + ta.value.slice(t);
          ta.selectionStart = ta.selectionEnd = s + 2;
          ta.dispatchEvent(new Event("input"));
        }
      });
      body.append(pre, ta); frame.append(body);
      Object.assign(rec, { body, pre, code, ta });
    } else {
      const body = document.createElement("div"); body.className = "diagram-body";
      frame.append(body); rec.body = body;
    }
  } else {
    const label = document.createElement("div");
    label.className = "label"; label.contentEditable = "plaintext-only"; label.spellcheck = false;
    label.addEventListener("input", () => {
      autofit(rec);
      debounce(node.id + ":x", () => send({ type:"user_text", id:node.id, text:label.textContent }));
    });
    frame.append(label); rec.label = label;
  }

  const grip = document.createElement("div"); grip.className = "grip"; root.append(grip);

  root.addEventListener("pointerdown", e => {
    if (tool !== "line") return;
    e.preventDefault(); e.stopPropagation(); linkClick(node.id);
  }, true);

  behaviour(rec, node.id, grip);
  $("world").append(root);
  return rec;
}

function behaviour(rec, id, grip) {
  const handle = rec.head || rec.frame;
  handle.addEventListener("pointerdown", e => {
    if (e.target.closest(".icon, select, .title")) return;
    if (!rec.head && e.target.isContentEditable && document.activeElement === e.target) return;
    e.preventDefault(); e.stopPropagation();
    if (e.shiftKey) select(selection.has(id) ? [...selection].filter(i => i !== id) : [...selection, id]);
    else if (!selection.has(id)) select([id]);

    const start = toWorld(e.clientX, e.clientY);
    const from = new Map([...selection].map(i => [i, { x:state.nodes[i].x, y:state.nodes[i].y }]));
    dragging = true;
    handle.setPointerCapture(e.pointerId);

    const move = ev => {
      const at = toWorld(ev.clientX, ev.clientY);
      const dx = at.x - start.x, dy = at.y - start.y;
      for (const [i, origin] of from) {
        const other = els.get(i); if (!other) continue;
        other.node.x = Math.round(origin.x + dx); other.node.y = Math.round(origin.y + dy);
        place(other);
      }
      drawWires();
    };
    const stop = () => {
      handle.removeEventListener("pointermove", move);
      handle.removeEventListener("pointerup", stop);
      dragging = false;
      send({ type:"user_move", moves:[...from.keys()].map(i =>
        ({ id:i, x:els.get(i).node.x, y:els.get(i).node.y })) });
    };
    handle.addEventListener("pointermove", move);
    handle.addEventListener("pointerup", stop);
  });

  grip.addEventListener("pointerdown", e => {
    e.preventDefault(); e.stopPropagation();
    const start = toWorld(e.clientX, e.clientY);
    const from = { w:rec.node.w, h:rec.node.h };
    dragging = true;
    grip.setPointerCapture(e.pointerId);
    const move = ev => {
      const at = toWorld(ev.clientX, ev.clientY);
      rec.node.w = Math.max(60, Math.round(from.w + at.x - start.x));
      rec.node.h = Math.max(32, Math.round(from.h + at.y - start.y));
      place(rec); drawWires();
    };
    const stop = () => {
      grip.removeEventListener("pointermove", move);
      grip.removeEventListener("pointerup", stop);
      dragging = false;
      send({ type:"user_resize", id, w:rec.node.w, h:rec.node.h, fitted:false });
    };
    grip.addEventListener("pointermove", move);
    grip.addEventListener("pointerup", stop);
  });
}

function linkClick(id) {
  if (!linkFrom) { linkFrom = id; els.get(id)?.root.classList.add("link-source");
                   hint("Now click the node it connects to"); return; }
  if (linkFrom !== id) send({ type:"user_connect", from:linkFrom, to:id });
  els.get(linkFrom)?.root.classList.remove("link-source");
  linkFrom = null; setTool("select");
}

const place = rec => Object.assign(rec.root.style, {
  left:`${rec.node.x}px`, top:`${rec.node.y}px`,
  width:`${rec.node.w}px`, height:`${rec.node.h}px` });

/* grow a box or sticky to fit what it says, until someone resizes it by hand */
function autofit(rec) {
  if (!rec.label || !rec.node?.fitted) return;
  const label = rec.label;
  const needed = label.scrollHeight + (rec.node.type === "text" ? 8 : 20);
  if (needed > rec.node.h) {
    rec.node.h = Math.min(600, Math.ceil(needed));
    place(rec);
    debounce(rec.node.id + ":fit",
      () => send({ type:"user_resize", id:rec.node.id, w:rec.node.w, h:rec.node.h, fitted:true }), 400);
  }
}

const diagramCache = new Map();
async function paintDiagram(rec, node) {
  if (diagramCache.get(node.id) === node.text) return;
  diagramCache.set(node.id, node.text);
  const src = (node.text || "").trim();
  if (!src) { rec.body.innerHTML = '<div class="empty">Nothing drawn yet.</div>'; return; }
  if (!mermaid) { rec.body.replaceChildren(Object.assign(document.createElement("pre"),
    { textContent:src })); return; }
  try {
    const { svg } = await mermaid.render("m" + node.id + Date.now(), src);
    rec.body.innerHTML = svg;
  } catch {
    rec.body.replaceChildren(Object.assign(document.createElement("pre"), { textContent:src }));
  }
}

const stamp = n => `${n.text}|${n.title}|${n.language}|${n.fill}|${n.stroke}|${n.size}|${n.bold}|${n.w}|${n.h}`;

function paint(rec, node, origin) {
  rec.node = node;
  rec.root.className = `node ${node.type} size-${node.size || "m"}`
    + (node.bold ? " bold" : "") + (node.type === "box" ? ` ${node.shape}` : "")
    + (selection.has(node.id) ? " selected" : "");
  rec.root.dataset.lang = node.language || "";
  const painted = node.fill && node.fill !== "none";
  rec.frame.style.background = painted ? `var(--f-${node.fill})` : "";
  // A bare label is just text on the canvas: it only grows a frame once it has
  // been given a fill, or a stroke that isn't the default.
  const framed = node.type !== "text" || painted || (node.stroke && node.stroke !== "grey");
  rec.frame.style.borderColor = framed ? `var(--s-${node.stroke || "grey"})` : "transparent";
  if (!dragging) place(rec);

  if (rec.title && rec.title !== document.activeElement && rec.title.textContent !== node.title)
    rec.title.textContent = node.title || "";
  if (rec.lang && rec.lang.value !== node.language) rec.lang.value = node.language;
  if (rec.ta) {
    if (document.activeElement !== rec.ta && rec.ta.value !== node.text) rec.ta.value = node.text;
    rec.code.innerHTML = highlight(rec.ta.value, node.language);
  }
  if (rec.label && rec.label !== document.activeElement && rec.label.textContent !== node.text) {
    rec.label.textContent = node.text;
    requestAnimationFrame(() => autofit(rec));
  }
  if (node.type === "diagram") paintDiagram(rec, node);

  const next = stamp(node);
  if (origin === "claude" && stamps.get(node.id) !== undefined && stamps.get(node.id) !== next) {
    rec.root.classList.remove("pulse"); void rec.root.offsetWidth; rec.root.classList.add("pulse");
  }
  stamps.set(node.id, next);
}

/* ---- wires ---- */
function edgePoint(node, towards) {
  const cx = node.x + node.w / 2, cy = node.y + node.h / 2;
  const dx = towards.x - cx, dy = towards.y - cy;
  if (!dx && !dy) return { x:cx, y:cy };
  const scale = Math.min(
    Math.abs(dx) > 0.001 ? (node.w / 2) / Math.abs(dx) : Infinity,
    Math.abs(dy) > 0.001 ? (node.h / 2) / Math.abs(dy) : Infinity);
  return { x:cx + dx * scale, y:cy + dy * scale };
}
const SVGNS = "http://www.w3.org/2000/svg";
function drawWires() {
  const layer = $("wire-layer");
  layer.replaceChildren();
  for (const edge of Object.values(state.edges || {})) {
    const a = els.get(edge.from)?.node, b = els.get(edge.to)?.node;
    if (!a || !b) continue;
    const ca = { x:a.x + a.w/2, y:a.y + a.h/2 }, cb = { x:b.x + b.w/2, y:b.y + b.h/2 };
    const p1 = edgePoint(a, cb), p2 = edgePoint(b, ca);
    const mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
    const d = `M ${p1.x} ${p1.y} Q ${mx} ${my} ${p2.x} ${p2.y}`;

    const hit = document.createElementNS(SVGNS, "path");
    hit.setAttribute("d", d); hit.setAttribute("class", "hit");
    hit.addEventListener("click", () => send({ type:"user_delete", ids:[edge.id] }));
    hit.append(Object.assign(document.createElementNS(SVGNS, "title"),
      { textContent:"Click to remove this line" }));

    const line = document.createElementNS(SVGNS, "path");
    line.setAttribute("d", d);
    line.setAttribute("class", "line");
    line.setAttribute("stroke", `var(--s-${edge.color || "grey"})`);
    line.setAttribute("stroke-width", edge.width || 2);
    if (edge.style === "dashed") line.setAttribute("stroke-dasharray", "6 5");
    line.setAttribute("marker-end", "url(#arrow)");
    layer.append(hit, line);

    if (edge.label) {
      const text = document.createElementNS(SVGNS, "text");
      text.setAttribute("x", mx); text.setAttribute("y", my - 6);
      text.setAttribute("text-anchor", "middle");
      text.textContent = edge.label;
      layer.append(text);
    }
  }
}
$("wires").insertAdjacentHTML("afterbegin",
  `<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
   orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>`);

/* ---- export ---- */
function boardSVG() {
  const nodes = Object.values(state.nodes);
  if (!nodes.length) return null;
  const pad = 40;
  const minX = Math.min(...nodes.map(n => n.x)) - pad, minY = Math.min(...nodes.map(n => n.y)) - pad;
  const maxX = Math.max(...nodes.map(n => n.x + n.w)) + pad;
  const maxY = Math.max(...nodes.map(n => n.y + n.h)) + pad;
  const css = getComputedStyle(document.documentElement);
  const tone = name => css.getPropertyValue(`--s-${name}`).trim() || "#888";
  const tint = name => name === "none" ? "none" : (css.getPropertyValue(`--f-${name}`).trim() || "none");
  const paper = css.getPropertyValue("--paper").trim();
  const ink = css.getPropertyValue("--ink").trim();
  const out = [];

  for (const e of Object.values(state.edges)) {
    const a = state.nodes[e.from], b = state.nodes[e.to];
    if (!a || !b) continue;
    const ca = { x:a.x+a.w/2, y:a.y+a.h/2 }, cb = { x:b.x+b.w/2, y:b.y+b.h/2 };
    const p1 = edgePoint(a, cb), p2 = edgePoint(b, ca);
    out.push(`<path d="M ${p1.x} ${p1.y} L ${p2.x} ${p2.y}" fill="none" stroke="${tone(e.color||'grey')}"
      stroke-width="${e.width||2}" ${e.style === "dashed" ? 'stroke-dasharray="6 5"' : ""}/>`);
    if (e.label) out.push(`<text x="${(p1.x+p2.x)/2}" y="${(p1.y+p2.y)/2-6}" text-anchor="middle"
      font-family="sans-serif" font-size="11.5" fill="${tone('grey')}">${esc(e.label)}</text>`);
  }

  for (const n of nodes.sort((p, q) => p.y - q.y)) {
    const fs = { s:12, m:14.5, l:20 }[n.size || "m"];
    const rx = n.type === "box" && n.shape === "ellipse" ? n.w/2 : n.type === "sticky" ? 3 : 10;
    if (n.type !== "text") {
      out.push(`<rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="${rx}" ry="${
        n.type==="box"&&n.shape==="ellipse"?n.h/2:rx}" fill="${tint(n.fill)==="none"?paper:tint(n.fill)}"
        stroke="${tone(n.stroke||'grey')}" stroke-width="1.5"/>`);
    }
    if (n.title) out.push(`<text x="${n.x+10}" y="${n.y+18}" font-family="sans-serif" font-size="12.5"
      font-weight="600" fill="${ink}">${esc(n.title)}</text>`);
    const mono = n.type === "doc";
    const body = (n.text || "").split("\n").slice(0, Math.floor(n.h / (mono ? 19 : fs * 1.35)));
    const top = n.y + (n.title ? 38 : (n.type === "box" ? n.h/2 - (body.length-1)*fs*0.7 : 22));
    body.forEach((line, i) => out.push(
      `<text x="${n.type === "box" ? n.x + n.w/2 : n.x + 11}" y="${top + i * (mono ? 19 : fs*1.35)}"
       ${n.type === "box" ? 'text-anchor="middle"' : ""} xml:space="preserve"
       font-family="${mono ? "ui-monospace,Menlo,monospace" : "sans-serif"}"
       font-size="${mono ? 12.5 : fs}" ${n.bold ? 'font-weight="700"' : ""}
       fill="${ink}">${esc(line)}</text>`));
  }

  return `<svg xmlns="http://www.w3.org/2000/svg" width="${maxX-minX}" height="${maxY-minY}"
    viewBox="${minX} ${minY} ${maxX-minX} ${maxY-minY}">
    <rect x="${minX}" y="${minY}" width="${maxX-minX}" height="${maxY-minY}" fill="${paper}"/>
    ${out.join("\n")}</svg>`;
}

function download(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = Object.assign(document.createElement("a"), { href:url, download:name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

$("export").addEventListener("click", async () => {
  const svg = boardSVG();
  if (!svg) { hint("Nothing to export yet"); return; }
  const stem = (state.slug || "board");
  if (!confirm("OK for PNG, Cancel for SVG")) {
    download(new Blob([svg], { type:"image/svg+xml" }), `${stem}.svg`);
    return;
  }
  const img = new Image();
  img.onload = () => {
    const scale = 2;
    const canvas = Object.assign(document.createElement("canvas"),
      { width:img.width * scale, height:img.height * scale });
    const ctx = canvas.getContext("2d");
    ctx.scale(scale, scale);
    ctx.drawImage(img, 0, 0);
    canvas.toBlob(b => download(b, `${stem}.png`), "image/png");
  };
  img.onerror = () => hint("Couldn't rasterise — SVG export still works");
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
});

/* ---- board plumbing ---- */
let pickerSig = "";
function renderPicker() {
  const saved = state.saved || [];
  const sig = saved.map(b => b.slug + b.updated).join("|");
  if (sig === pickerSig) return;
  pickerSig = sig;
  const sel = $("board-picker");
  sel.replaceChildren(new Option("Saved…", ""),
    ...saved.map(b => new Option(`${b.name} · ${b.nodes} items`, b.slug)));
  sel.value = saved.some(b => b.slug === state.slug) ? state.slug : "";
}
$("board-picker").addEventListener("change", e => {
  if (e.target.value) send({ type:"user_load", slug:e.target.value });
});
$("new-board").addEventListener("click", () => {
  const name = prompt("Name for the new board");
  if (name?.trim()) send({ type:"user_new", name:name.trim() });
});
$("board-name").addEventListener("change", e => send({ type:"user_rename", name:e.target.value }));

function render(origin) {
  if ($("board-name") !== document.activeElement) $("board-name").value = state.name || "";
  $("undo").disabled = !state.can_undo;
  $("redo").disabled = !state.can_redo;

  for (const [id, rec] of els)
    if (!state.nodes[id]) { rec.root.remove(); els.delete(id); stamps.delete(id); diagramCache.delete(id); }
  for (const node of Object.values(state.nodes || {})) {
    let rec = els.get(node.id);
    if (!rec || rec.type !== node.type) { rec?.root.remove(); rec = makeNode(node); els.set(node.id, rec); }
    paint(rec, node, origin);
  }
  for (const id of [...selection]) if (!state.nodes[id]) selection.delete(id);
  drawWires();
  paintStyler();
  renderPicker();
  $("empty-hint").hidden = Object.keys(state.nodes || {}).length > 0;
}

applyView();
connect();
</script>
</body>
</html>
